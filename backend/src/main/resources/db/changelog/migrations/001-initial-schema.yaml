databaseChangeLog:
  - changeSet:
      id: 001-create-hibernate-sequence
      author: gemini-cli
      changes:
        - createSequence:
            sequenceName: hibernate_sequence
            startValue: 100
            incrementBy: 50

  - changeSet:
      id: 001-create-users-table
      author: gemini-cli
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: varchar(20)
              - column:
                  name: date_of_birth
                  type: date
              - column:
                  name: address
                  type: varchar(255)
              - column:
                  name: phone_number
                  type: varchar(50)
              - column:
                  name: nationality
                  type: varchar(100)
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
              - column:
                  name: created_by
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(255)

